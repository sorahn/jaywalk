[package]
name = "jaywalk"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-only"
default-run = "jaywalk"

[dependencies]
async-channel = "2.5"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "1.2"
# Preserve comments when the palette changes keyboard.profile.
toml_edit = "0.25"
similar = "2.7"
gpui-kit = { version = "=0.8.0", features = ["tree-sitter-languages"] }
notify = "8.2.2"

[profile.dev]
debug = 0

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }

[dev-dependencies]
# Headless state/scroll regressions; these tests never open a native window.
gpui-test = { package = "gpui-pre", version = "=0.3.9", default-features = false, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
core-foundation-sys = "=0.8.7"
