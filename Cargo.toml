[package]
name = "jaywalk"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-only"
default-run = "jaywalk"

[features]
profiling = ["gpui-kit/profiler"]

[dependencies]
libc = "0.2"
async-channel = "2.5"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
# Reuse the locked date parser for history search dates and backend timestamps.
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
toml = "1.2"
# Preserve comments when the palette changes keyboard.profile.
toml_edit = "0.25"
similar = "2.7"
tree-sitter = "0.26.13"
gpui-kit = { version = "=0.10.0", features = ["tree-sitter-languages"] }
notify = "8.2.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"

[profile.dev]
debug = 0

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }

[dev-dependencies]
# Headless state/scroll regressions; these tests never open a native window.
gpui-test = { package = "gpui-pre", version = "=0.3.12", default-features = false, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Reuse the platform backend's pinned bindings for native accent resolution/notifications.
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSColor", "NSColorSpace", "NSAppearance", "block2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSString", "NSObject", "block2"] }

core-foundation = "=0.10.1"
core-foundation-sys = "=0.8.7"
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }
