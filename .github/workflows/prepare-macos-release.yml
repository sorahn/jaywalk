name: prepare macos release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prepare-macos-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release-automation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create repository-scoped release token
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-actions: write
      - name: Reserve tag at the approved main commit
        id: release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/release-version.py prepare "$SOURCE_COMMIT"
      - name: Start official candidate build on the immutable tag
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run macos-release.yml --ref "$RELEASE_TAG" -f mode=official
