name: macos release candidate
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source:
        required: true
        type: string
      version:
        required: true
        type: string
      checks:
        required: true
        type: string
      automation_ref:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Optional calendar app version for an unsigned rehearsal
        type: string
permissions:
  contents: read
concurrency:
  group: macos-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  rehearsal:
    if: inputs.tag == ''
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CARGO_BUILD_JOBS: '3'
      JAYWALK_SIGNING_IDENTITY: '-'
      JAYWALK_MACOS_UPDATER: '1'
      JAYWALK_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify icon compiler before building
        run: scripts/test-macos-icon.sh
      - name: Prepare toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup override set 1.100.0
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          # Toolchain/lockfile keys are automatic; also isolate Apple SDKs and
          # invalidate path dependencies when our vendored source changes.
          key: rehearsal-macos26-${{ hashFiles('vendor/**') }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST DEVELOPER_DIR MACOSX_DEPLOYMENT_TARGET
          cache-bin: false
      - name: Build unsigned candidate
        run: |
          test "$(uname -m)" = arm64
          export JAYWALK_SPARKLE_DIR="$PWD/target/sparkle"
          python3 scripts/fetch-sparkle.py "$JAYWALK_SPARKLE_DIR"
          scripts/bundle-macos.sh release
          python3 scripts/release-macos.py package target/release/Jaywalk.app target/distribution
          python3 scripts/release-macos.py manifest target/release/Jaywalk.app target/distribution/*.zip target/distribution/*.dmg > target/distribution/manifest.json
          printf '%s\n' 'UNSIGNED REHEARSAL. Not notarized, not an official release, and no update feed is configured.' > target/distribution/REHEARSAL.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-macos-arm64-rehearsal
          path: target/distribution/
          retention-days: 7
  official:
    if: github.ref == 'refs/heads/main' && inputs.tag != ''
    environment: macos-release
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CARGO_BUILD_JOBS: '3'
      JAYWALK_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      EXPECTED_SOURCE: ${{ inputs.source }}
      JAYWALK_RELEASE_VERSION: ${{ inputs.version }}
      JAYWALK_RELEASE_CHECKS_RUN: ${{ inputs.checks }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Verify icon compiler before building
        run: scripts/test-macos-icon.sh
      - name: Install pinned repository test tools
        run: scripts/install-ci-tools-macos.sh
      - name: Install pinned toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.100.0
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          # Toolchain/lockfile keys are automatic; also isolate Apple SDKs and
          # invalidate path dependencies when our vendored source changes.
          key: official-macos26-${{ hashFiles('vendor/**') }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST DEVELOPER_DIR MACOSX_DEPLOYMENT_TARGET
          cache-bin: false
      # Partial cache restores prune non-Cargo files under target/. Load the
      # pinned automation afterward so signing/verification scripts survive.
      - name: Load current release automation independently of source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.automation_ref }}
          path: target/release-automation
          persist-credentials: false
      - name: Validate allocation, exact source and successful checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          python3 target/release-automation/scripts/release-pipeline.py check-source "$JAYWALK_RELEASE_TAG" "$EXPECTED_SOURCE" "$JAYWALK_RELEASE_CHECKS_RUN"
          python3 target/release-automation/scripts/release-macos.py check-tag "$JAYWALK_RELEASE_TAG"
      # The allocation above validates the exact source's completed checks run.
      # Reuse those checks; the injected version policy is covered by headless tests.
      - name: Sign, notarize and prepare draft assets
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          UPDATE_FEED_URL: ${{ vars.UPDATE_FEED_URL }}
        run: JAYWALK_RELEASE_SOURCE="$GITHUB_WORKSPACE" target/release-automation/scripts/release-sign-macos.sh
      - name: Create draft release only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 target/release-automation/scripts/release-pipeline.py draft "$JAYWALK_RELEASE_TAG" target/distribution
