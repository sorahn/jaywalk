[[setting]]
key = "ui.accent_color"
title = "Accent color"
summary = "Use the system accent or a custom color for active controls, links and focus outlines."
description = "Application-wide accent: \"system\", a shared #RRGGBB string or a light/dark pair (see below), case-insensitive hex. On macOS, system reads AppKit’s user accent preference for the app’s selected light/dark appearance and follows system-color notifications. Explicit hex/pair values override the system. Updates active icons, primary controls (including checkboxes/switches), focus rings, links and selection tints; filled controls choose a light/dark foreground. Git statuses, diff colors and graph lanes stay semantic. Invalid edits retain the last valid config."
category = "appearance"
section = "Colors"
section_order = 0
kind = "color"

[[setting]]
key = "theme.shell_auto.enabled"
title = "Generate shell colors"
description = "Derive shell surfaces from the light/dark seed colors. Exact theme overrides still take precedence."
