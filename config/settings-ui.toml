description = "In checkout_if_clean mode: detached uses the pinned commit; existing reuses the PR’s named local branch only at that exact commit; create_from_remote also creates that local name when a matching PR-source remote-tracking branch points to the pinned commit. No origin/ prefix is added to the local name. A conflicting local branch is never reset; missing or mismatched refs fall back to detached checkout. Applies to the next acquisition."
category = "repositories"
section = "Local review"
section_order = 2
kind = "choice"
choices = ["create_from_remote", "existing", "detached"]

[[setting]]
key = "local_review.cleanup_created_branch"
title = "Cleanup created branch"
summary = "After restoring the checkout, remove only unchanged, unused branches that Jaywalk created for that review."
description = "After guarded restoration, optionally delete a branch created by that review, only if its commit and creation ownership marker are unchanged and no worktree uses it. Existing branches are never deleted. Creation uses an atomic absent-ref check and a receipt-specific reflog marker; deletion checks the expected commit atomically; skipped cleanup retains the recovery receipt for retry. This choice is saved in the receipt at acquisition, so later config edits do not alter an active review’s cleanup policy."
category = "repositories"
section = "Local review"
section_order = 2
kind = "boolean"

