key = "panels.diff.shared_scrollbar_click"
title = "Shared scrollbar click"
summary = "Click the Fluid gutter to jump or page, or follow the system preference. Restart to reread system preferences."
description = "Track clicks: system, jump, or page. page moves one viewport toward the click; jump centers the thumb at the click. system uses the desktop preference captured at startup, falling back to jump if unavailable. Restart to reread OS preferences. Thumb dragging always covers the full scroll range."
