description = "Temporary Git storage budget in MiB, 16–8192. Checked periodically while Git runs and after acquisition; transient disk usage can exceed the budget between checks. A storage-limit failure stops acquisition and retains hosted viewing. This is not a hard OS disk quota or process-memory bound."
