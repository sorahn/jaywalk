description = "hosted uses provider-backed content. isolated tries a matching known repository and acquires pinned PR objects in private Jaywalk-owned temporary storage, leaving the known checkout/refs/index unchanged. checkout_if_clean additionally attempts a temporary checkout in a clean plain-Git repository, with guarded restoration. Branch selection follows checkout_branch. All local behavior is opt-in."
