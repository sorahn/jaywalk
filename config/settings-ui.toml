summary = "Opacity of the Fluid gutter’s change map. Set to zero to hide it."
description = "Whole-comparison change marks in the Fluid gutter; 0–1, zero hides them. Left marks show before-side changes; right marks show after-side changes. Uses the adaptive diff palette, brightens slightly while dragging. Marks share the thumb's scroll coordinate; they have no hover UI or separate click behavior."
category = "diff"
section = "Fluid gutter"
section_order = 3
kind = "number"
step = 0.05
minimum = 0.0
maximum = 1.0

