# Copy this file to ~/.config/jaywalk/config.toml and edit it directly.
# Unspecified values inherit these defaults. Saved edits apply automatically.

[window]
width = 1500
height = 950

[ui]
# Suppress transient loading indicators; 0 shows them immediately.
loading_delay_ms = 200
# Reserved comparison toolbar height; grows if the UI font needs more space.
comparison_bar_height = 36
font_size = 16
ligatures = true
# font_family = "Helvetica Neue"

[editor]
font_size = 13
line_numbers = true
tab_size = 4
ligatures = true
# Omit font_family to keep the platform's default monospace font.
# font_family = "Menlo"

[panels.history]
default_width = 280
min_width = 180
max_width = 700

[panels.history.font]
size = 14
ligatures = true
# family = "Helvetica Neue"

[panels.files]
default_width = 260
min_width = 200
max_width = 700

[panels.files.font]
size = 14
ligatures = true
# family = "Helvetica Neue"

[panels.diff]
gutter_width = 48
min_code_width = 100
# The before/after panes default to an even split of the remaining width.

[history]
# Minimum row height; larger UI fonts can require more space.
row_height = 26
lane_spacing = 12

[files]
default_view = "list"
tree_row_height = 30
indent_width = 12
compact_paths = true
list_word_wrap = false
# Tree rows stay single-line and scroll horizontally.

[diff]
# "inline", "side_by_side", or "fluid"
default_view = "fluid"

[diff.before]
word_wrap = false

[diff.after]
word_wrap = false

[diff.inline]
word_wrap = false

[evolution]
visible = false
# Current and selected versions remain visible.
show_unchanged_rebases = false
collapse_repeats = true
default_height = 320
min_height = 180
max_height = 700
min_history_height = 120
row_height = 48
limit = 100

# Independent dock below Changed files. Shares the recorded change timeline.
[file_evolution]
visible = true
default_height = 320
min_height = 180
max_height = 700
min_files_height = 120

[live]
enabled = true
poll_interval_ms = 1500

# Configuration reload is independent of recorded repository refresh above.
[settings]
poll_interval_ms = 500
# Omit editor to use the platform's default text editor.
# On macOS, a string selects an application by name or .app path.
# editor = "Zed"
# An array runs an executable with literal arguments; the config path is appended.
# editor = ["code", "--reuse-window"]

# Keys use GPUI notation: secondary = Cmd on macOS, Ctrl elsewhere.
# Replace a command's entire array to rebind it; [] removes its shortcuts.
# Space-separated keystrokes form chords, e.g. "secondary-k secondary-s".
[keybindings]
about = []
open_repository = ["secondary-o"]
find_file = ["secondary-p"]
show_commands = ["secondary-shift-p", "f1"]
open_settings = ["secondary-,"]
version_patch = []
since_previous = []
refresh = ["secondary-r"]
whole_branch = ["secondary-shift-b"]
overview = []
toggle_history = ["secondary-b"]
toggle_files = ["secondary-shift-e"]
toggle_change_evolution = []
toggle_file_evolution = []
toggle_wrap = ["alt-z"]
toggle_line_numbers = []
view_inline = []
view_side_by_side = []
view_fluid = []
next_change = ["alt-f5", "f7"]
previous_change = ["alt-shift-f5", "shift-f7"]
next_file = ["alt-down"]
previous_file = ["alt-up"]
next_revision = ["secondary-alt-down"]
previous_revision = ["secondary-alt-up"]
zoom_in = ["secondary-="]
zoom_out = ["secondary--"]
reset_zoom = ["secondary-0"]
reset_layout = []
history_left = []
history_right = []
files_left = []
files_right = []
swap_sidebars = []
change_evolution_sidebar = []
change_evolution_bottom = []
file_evolution_sidebar = []
file_evolution_bottom = []
reset_interface = []
quit = ["secondary-q"]
close_window = ["secondary-w"]
minimize = ["secondary-m"]
fullscreen = ["ctrl-secondary-f"]
hide = ["secondary-h"]
hide_others = ["secondary-alt-h"]
show_all = []

# Startup defaults; remembered repository choices are stored separately.
[layout]
remember_per_repository = true
history_visible = true
files_visible = true
bottom_height = 280
min_bottom_height = 120
max_bottom_height = 700

[layout.placement]
history_side = "left"
files_side = "left"
# Left-to-right order when both sidebars share a side.
sidebar_order = "history_first"
# "sidebar" keeps each timeline below its associated list; "bottom" docks it
# under the central workspace. Two bottom timelines appear beside each other.
change_evolution = "sidebar"
file_evolution = "sidebar"
