# Copy this file to ~/.config/jaywalk/config.toml and edit it directly.
# Unspecified values inherit these defaults. Saved edits apply automatically.

[keyboard]
# Loads keybindings/default.toml beside this config.
profile = "keybindings/default.toml"
additional_directories = []

[application]
quit_on_last_window = true
# Reuse the current viewer for CLI, recent-repository and normal Open actions.
single_window_mode = false

# In-memory visited views per window; reducing the limit trims old entries live.
[comparison]
# Order newly selected pairs; explicit CLI requests keep their direction.
pair_order = "ancestry"

[navigation]
history_limit = 100

[welcome]
recent_count = 5

[window]
width = 1500
height = 950

[ui]
# Application-wide active icons, control fills, selections and focus accents.
appearance = "system"
accent_color = { light = "#0066b8", dark = "#3794ff" }
# Suppress transient loading indicators; 0 shows them immediately.
loading_delay_ms = 200
# Shared minimum for history, flat files and directory-tree rows.
row_height = 26
panel_header_height = 30
toolbar_height = 28
footer_height = 28
footer_font_size = 12
footer_control_height = 22
# Reserved comparison toolbar height; grows if the UI font needs more space.
comparison_bar_height = 30
font_size = 16
ligatures = true
# font_family = "Helvetica Neue"

[editor]
font_size = 13
line_numbers = true
tab_size = 4
ligatures = true
# Omit font_family to keep the platform's default monospace font.
# font_family = "Menlo"

[panels.history]
default_width = 280
min_width = 180
max_width = 700

[panels.history.font]
size = 14
ligatures = true
# family = "Helvetica Neue"

[panels.files]
default_width = 260
min_width = 200
max_width = 700

[panels.files.font]
size = 14
ligatures = true
# family = "Helvetica Neue"

[panels.diff]
gutter_width = 48
# Shared fluid scrollbar spans the gutter; its thumb stays inset at both ends.
shared_scrollbar_height = 12
shared_scrollbar_opacity = 0.12
# system, jump, or page. Unknown system preferences fall back to jump.
shared_scrollbar_click = "system"
# Whole-comparison change markers behind the thumb and connectors; 0 hides them.
change_map_opacity = 0.24
min_code_width = 100
# The before/after panes default to an even split of the remaining width.

[history]
# Alternate row tint; 0 disables stripes. Updates live.
stripe_opacity = 0.08
# Minimum row height; larger UI fonts can require more space.
# row_height = 30 # Optional override of ui.row_height.
lane_spacing = 8
show_reference_labels = true
reference_badge_width = 110

[history.remotes]
# Applies to new remotes as well as those without an explicit override.
default_visible = true
# [history.remotes.overrides]
# origin = false

[overview]
context_lines = 3
expansion_lines = 20
# For overviews without changed files; otherwise the message scrolls with the diff.
message_max_height = 220

[files]
default_view = "list"
# Cmd+P always searches the entire repository, independently of this tree filter.
tree_scope = "changed"
# tree_row_height = 30
# list_row_height = 30
indent_width = 12
indent_guides = true
indent_guide_opacity = 0.12
# Shift guides relative to ancestor folder-icon centers; negative is left.
indent_guide_offset = -2
file_icons = true
compact_paths = true
list_word_wrap = false
# Tree rows stay single-line and scroll horizontally.

[diff]
# MiB per side; bounded reads prevent allocation beyond this limit.
max_text_file_size_mb = 5
# "inline", "side_by_side", or "fluid"
default_view = "fluid"
# Standard inline/side-by-side views; Fluid always shows full files.
collapse_unchanged = false
context_lines = 3
expansion_lines = 20

# All colors accept a shared "#RRGGBB" or a light/dark pair.
# Background and word hues are tinted by the viewer to preserve syntax legibility.
[diff.colors]
added = { light = "#22863a", dark = "#4ec96e" }
removed = { light = "#cf222e", dark = "#f85149" }
modified = { light = "#0969da", dark = "#3794ff" }
added_background = { light = "#22863a", dark = "#4ec96e" }
removed_background = { light = "#cf222e", dark = "#f85149" }
modified_background = { light = "#0969da", dark = "#3794ff" }
word_added = { light = "#22863a", dark = "#4ec96e" }
word_removed = { light = "#cf222e", dark = "#f85149" }
conflict_base = { light = "#57606a", dark = "#a4b4c2" }

[diff.before]
word_wrap = false

[diff.after]
word_wrap = false

[diff.inline]
word_wrap = false

[evolution]
visible = false
# Current and selected versions remain visible.
show_unchanged_rebases = false
collapse_repeats = true
default_height = 320
min_height = 180
max_height = 700
min_history_height = 120
row_height = 48
limit = 100

# Independent dock below Changed files. Shares the recorded change timeline.
[file_evolution]
visible = true
default_height = 320
min_height = 180
max_height = 700
min_files_height = 120

[live]
# Git watches saved worktree/index changes; jj follows recorded operations.
enabled = true
# Git fallback scan interval and jj recorded-operation polling interval.
poll_interval_ms = 1500

# Configuration reload is independent of recorded repository refresh above.
[settings]
poll_interval_ms = 500
# Omit editor to use the platform's default text editor.
# On macOS, a string selects an application by name or .app path.
# editor = "Zed"
# An array runs an executable with literal arguments; the config path is appended.
# editor = ["code", "--reuse-window"]

# Startup defaults; remembered repository choices are stored separately.
[layout]
remember_per_repository = true
history_visible = true
files_visible = true
bottom_height = 280
min_bottom_height = 120
max_bottom_height = 700

[layout.placement]
history_side = "left"
files_side = "left"
# Left-to-right order when both sidebars share a side.
sidebar_order = "history_first"
# "sidebar" keeps each timeline below its associated list; "bottom" docks it
# under the central workspace. Two bottom timelines appear beside each other.
change_evolution = "sidebar"
file_evolution = "sidebar"
