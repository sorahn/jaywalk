# Jaywalk settings reference. Saved edits apply automatically.
# On first open Jaywalk creates ~/.config/jaywalk/config.toml (or
# $XDG_CONFIG_HOME/jaywalk/config.toml) with section headers active and defaults commented out.
# Uncomment only the values you want to override; section headers stay active.
# Omitted values inherit the current built-in defaults, including after updates.
# Dimensions are logical pixels unless noted. Colors accept a shared "#RRGGBB"
# or { light = "#RRGGBB", dark = "#RRGGBB" }. Keybindings have their own file.
# The existence of this file skips automatic Setup; Set up Jaywalk… is always
# available from the command palette. Creating it authorizes no network requests.

# Connected account metadata is added as [[accounts]] tables. Reorder them to
# choose account/list/request priority. Credentials stay in the OS store.
accounts = []

[ui]
# Interface typography, bars, spacing and active-control colors.
# Application-wide active icons, control fills, selections and focus accents.
# "system", "light", or "dark".
appearance = "system"
# "system", a hex color, or a light/dark pair.
accent_color = "system"
# Used when a native system accent is unavailable. Explicit accent_color colors override it.
accent_color_fallback = { light = "#0066b8", dark = "#3794ff" }
# Floating accent edges do not reserve layout space. Applies live.
accent_floating_outlines = true
# Suppress transient loading indicators; 0 shows them immediately.
loading_delay_ms = 400
# Shared minimum for history, flat files and directory-tree rows.
row_height = 26
panel_header_height = 30
toolbar_height = 28
footer_height = 28
footer_font_size = 12
footer_control_height = 22
# Reserved comparison toolbar height; grows if the UI font needs more space.
comparison_bar_height = 30
font_size = 16
ligatures = true
# font_family = "Helvetica Neue"

# Multipliers are independent of UI/editor font sizes. Applied live.

[ui.spacing]
# Logical pixels per unit (1–16); edge/interactive are multipliers (0–8).
unit = 4
edge = 2
interactive = 1

[theme]
# Shell colors are independent of syntax/diff colors and system accent.
# Exact role colors override generated colors; see docs/settings.md for role names.
overrides = {}

[theme.shell_auto]
enabled = true
algorithm = "tonal-v1"
# Seeds are inputs to the mode-specific recipe, not exact final backgrounds.
seed = { light = "#575757", dark = "#121212" }
# Surface separation (0–2.5).
layer_strength = 1.4
# Hue rotation in degrees (-180–180).
hue_shift = 0.0
# Saturation multiplier (0–3).
chroma_scale = 1.0
tint_strength = 1.0
# Lightness spread (0.2–2.5).
contrast_spread = 1.0
lightness_shift = 0.0
# Influence of the seed on the foundation (0–1).
seed_lightness_influence = 1.0

[theme.shell_auto.roles]
# Optional per-surface recipe overrides; see docs/settings.md for role names.
# Example: [theme.shell_auto.roles."shell.sidebar.files.background"]
# lightness_shift = { light = 0.0, dark = 0.02 }
# hue_shift = 0.0
# chroma_scale = 1.0

[window]
# Initial window size; sidebars and content adapt to smaller viewports.
width = 1500
height = 950

[layout]
# Startup panel visibility and per-repository layout restoration.
remember_per_repository = true
history_visible = true
files_visible = true
bottom_height = 280
min_bottom_height = 120
max_bottom_height = 700

[layout.placement]
# "left" or "right"; each sidebar can be placed independently.
history_side = "left"
files_side = "left"
# Left-to-right order when both sidebars share a side.
# "history_first" or "files_first".
sidebar_order = "history_first"
# "sidebar" keeps each timeline below its associated list; "bottom" docks it
# under the central workspace. Two bottom timelines appear beside each other.
change_evolution = "sidebar"
file_evolution = "sidebar"

[panels.history]
default_width = 280
min_width = 180
max_width = 700

[panels.history.font]
size = 14
ligatures = true
# family = "Helvetica Neue"

[panels.files]
default_width = 260
min_width = 200
max_width = 700

[panels.files.font]
size = 14
ligatures = true
# family = "Helvetica Neue"

[panels.diff]
gutter_width = 48
# Shared fluid scrollbar spans the gutter; its thumb stays inset at both ends.
shared_scrollbar_height = 12
shared_scrollbar_opacity = 0.12
# system, jump, or page. Unknown system preferences fall back to jump.
shared_scrollbar_click = "system"
# Whole-comparison change markers behind the thumb and connectors; 0 hides them.
change_map_opacity = 0.24
min_code_width = 100
# The before/after panes default to an even split of the remaining width.

[editor]
# Code typography; independent of interface/sidebar font settings.
font_size = 13
line_numbers = true
tab_size = 4
ligatures = true
# Omit font_family to keep the platform's default monospace font.
# font_family = "Menlo"

[diff]
# Viewer defaults and comparison presentation; original source bytes are preserved.
# Line matching: "myers" or "patience".
algorithm = "myers"
# Comparison changes alignment only; original source bytes remain intact.
# exact | ignore_trailing | ignore_changes | ignore_all
whitespace = "exact"
ignore_line_endings = false
ignore_blank_lines = false
word_highlight = true
show_whitespace = false
show_line_endings = false
highlight_whitespace_errors = false
# MiB per side; bounded reads prevent allocation beyond this limit.
max_text_file_size_mb = 5
# "inline", "side_by_side", or "fluid"
default_view = "fluid"
# Standard inline/side-by-side views; Fluid always shows full files.
collapse_unchanged = false
context_lines = 3
expansion_lines = 20

# All colors accept a shared "#RRGGBB" or a light/dark pair.
# Background and word hues are tinted by the viewer to preserve syntax legibility.

[diff.colors]
added = { light = "#22863a", dark = "#4ec96e" }
removed = { light = "#cf222e", dark = "#f85149" }
modified = { light = "#0969da", dark = "#3794ff" }
added_background = { light = "#22863a", dark = "#4ec96e" }
removed_background = { light = "#cf222e", dark = "#f85149" }
modified_background = { light = "#0969da", dark = "#3794ff" }
word_added = { light = "#22863a", dark = "#4ec96e" }
word_removed = { light = "#cf222e", dark = "#f85149" }
whitespace_error = { light = "#bc4c00", dark = "#ffb454" }
conflict_base = { light = "#57606a", dark = "#a4b4c2" }

[diff.before]
word_wrap = false

[diff.after]
word_wrap = false

[diff.inline]
word_wrap = false

[overview]
# Changeset overview folding and commit-message area.
context_lines = 3
expansion_lines = 20
# For overviews without changed files; otherwise the message scrolls with the diff.
message_max_height = 220

[files]
# File list/tree defaults and folder guide appearance.
# "list" or "tree".
default_view = "list"
# Cmd+P always searches the entire repository, independently of this tree filter.
# "changed" or "all".
tree_scope = "changed"
# tree_row_height = 30
# list_row_height = 30
# Omit to follow ui.spacing.edge × ui.spacing.unit. Explicit values remain supported.
# indent_width = 8
indent_guides = true
indent_guide_opacity = 0.12
# Shift guides relative to ancestor folder-icon centers; negative is left.
indent_guide_offset = -2
file_icons = true
compact_paths = true
list_word_wrap = false
# Tree rows stay single-line and scroll horizontally.

[history]
# Bounded initial graph load, older-page loading and history search.
# Page sizes count history rows, including the Git working-copy row.
# Suggested upper starting point: 10000. Larger graphs can use much more memory.
page_size = 5000
# Publish this first, then fill page_size in the background. Clamped to page_size.
initial_batch_size = 100
# Load the next history page near the end, or use explicit Load older.
page_on_scroll = false
# Matching results per history-search page.
search_page_size = 100
# Alternate row tint; 0 disables stripes. Updates live.
stripe_opacity = 0.08
# Minimum row height; larger UI fonts can require more space.
# row_height = 30 # Optional override of ui.row_height.
lane_spacing = 8
show_reference_labels = true
reference_badge_width = 110

[history.remotes]
# Applies to new remotes as well as those without an explicit override.
default_visible = true
# [history.remotes.overrides]
# origin = false

[evolution]
# jj change evolution below history (or in the bottom dock).
visible = false
# Current and selected versions remain visible.
show_unchanged_rebases = false
collapse_repeats = true
default_height = 320
min_height = 180
max_height = 700
min_history_height = 120
row_height = 48
limit = 100

# Independent dock below Changed files. Shares the recorded change timeline.

[file_evolution]
# File evolution below Files (or in the bottom dock).
visible = true
default_height = 320
min_height = 180
max_height = 700
min_files_height = 120

[comparison]
# Ordering of two points selected in the history graph.
# Order newly selected pairs; explicit CLI requests keep their direction.
# "ancestry" puts related ancestors first; "selection" follows click order.
pair_order = "ancestry"

[navigation]
# Back/Forward snapshots retained in each window.
# Maximum retained Back/Forward entries per window.
history_limit = 100

[picker]
# Unified command/file/repository/PR picker.
# Rank similarly relevant commands using local frequency and recency.
adaptive_command_order = true

[welcome]
# Recent repositories on the Welcome page.
# Recent repositories shown on Welcome.
recent_count = 10

[keyboard]
# Sparse keybinding profiles inherit shipped platform defaults.
# Loads keybindings/default.toml beside this config.
profile = "keybindings/default.toml"
additional_directories = []

[application]
# Window reuse and application lifetime.
quit_on_last_window = true
# Reuse the current viewer for CLI, recent-repository and normal Open actions.
single_window_mode = false

[updates]
# Update consent is opt-in. No automatic update traffic until checks are enabled.
# Check the public feed automatically; manual Check for updates remains available.
automatic_checks = false
# Requires automatic_checks. Downloads alone do not authorize installation.
automatic_downloads = false
# Requires automatic_downloads; permits installation on quit when safe.
automatic_installation = false
# Automatic check cadence in hours (1–168).
check_interval_hours = 24

[hosting]
# Snapshots are downloaded on demand and kept only in memory.
# Hosted PR limits; account credentials are kept in the OS credential store.
# Maximum independent account discoveries in flight across all windows.
concurrent_accounts = 3
# Commit rows per hosted PR (1–1000); API provider ceilings can be lower.
history_limit = 200
max_files = 3000
max_content_mb = 128

# Local PR acquisition and checkout are opt-in; project settings are separate.

[local_review]
# Optional local PR materialization; ordinary review stays hosted by default.
# "hosted", "isolated", or "checkout_if_clean" (plain Git only).
mode = "hosted"
# Object-store acquisition budget in MiB.
max_repository_mb = 512
# Permit acquisition of missing pinned PR commits when opening locally.
fetch_missing = true
# Prefer an existing local PR branch, or create one from a matching remote ref.
# Other choices: "existing" (never create), "detached".
checkout_branch = "create_from_remote"
# Remove only Jaywalk-created, unchanged, unused branches on guarded restoration.
cleanup_created_branch = false

[live]
# Refresh working changes separately from configuration reload.
# Git watches saved worktree/index changes; jj follows recorded operations.
enabled = true
# Git fallback scan interval and jj recorded-operation polling interval.
poll_interval_ms = 1500

# Configuration reload is independent of recorded repository refresh above.

[settings]
# Settings-file reload and optional external editor.
poll_interval_ms = 500
# Omit editor to use the platform's default text editor.
# On macOS, a string selects an application by name or .app path.
# editor = "Zed"
# An array runs an executable with literal arguments; the config path is appended.
# editor = ["code", "--reuse-window"]
