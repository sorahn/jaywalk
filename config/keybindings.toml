# Shipped keyboard defaults. User profiles contain only overrides.
keymap = []

# Keys use GPUI notation: secondary = Cmd on macOS, Ctrl elsewhere.
# Replace a command's entire array to rebind it; [] removes its shortcuts.
# Space-separated keystrokes form chords, e.g. "secondary-k secondary-s".
[keybindings]
# Back/forward through visited views, independent of file/commit ordering.
go_back = ["secondary-alt-left"]
go_forward = ["secondary-alt-right"]
about = []
open_repository = ["secondary-o"]
open_recent = ["ctrl-r"]
open_in_new_window = ["secondary-enter"]
compare_paths = []
show_welcome = []
clear_recent = []
find_file = ["secondary-p"]
show_commands = ["secondary-shift-p", "f1"]
open_settings = ["secondary-,"]
open_keybindings = []
select_keybindings = []
version_patch = ["secondary-k p"]
since_previous = ["secondary-k s"]
refresh = ["secondary-r"]
whole_branch = ["secondary-shift-b"]
overview = ["secondary-k o"]
show_references = ["secondary-k r"]
toggle_reference_labels = []
show_all_remotes = []
hide_all_remotes = []
reveal_selected_revision = ["secondary-k h"]
toggle_history = ["secondary-b"]
toggle_files = ["secondary-shift-e"]
toggle_change_evolution = ["secondary-k e"]
toggle_file_evolution = ["secondary-k f"]
toggle_wrap = ["alt-z", "secondary-k z"]
toggle_line_numbers = ["secondary-;"]
view_inline = ["secondary-k 1"]
view_side_by_side = ["secondary-k 2"]
view_fluid = ["secondary-k 3"]
next_change = ["secondary-down", "alt-f5", "f7"]
previous_change = ["secondary-up", "alt-shift-f5", "shift-f7"]
next_file = ["secondary-]", "alt-down"]
previous_file = ["secondary-[", "alt-up"]
next_revision = ["secondary-}", "secondary-alt-down"]
previous_revision = ["secondary-{", "secondary-alt-up"]
zoom_in = ["secondary-="]
zoom_out = ["secondary--"]
reset_zoom = ["secondary-0"]
reset_layout = []
history_left = []
history_right = []
files_left = []
files_right = []
swap_sidebars = []
change_evolution_sidebar = []
change_evolution_bottom = []
file_evolution_sidebar = []
file_evolution_bottom = []
reset_interface = []
quit = ["secondary-q"]
close_window = ["secondary-w"]
minimize = ["secondary-m"]
fullscreen = ["ctrl-secondary-f"]
hide = ["secondary-h"]
hide_others = ["secondary-alt-h"]
show_all = []

open_file = []
copy_path = []
copy_relative_path = []
copy_file_name = []
reveal_in_file_manager = []
collapse_files = []
expand_files = []
reveal_file = []
file_list = []
file_tree = []
tree_changed = []
tree_all = []

# Platform defaults are applied before sparse user overrides.
# On Linux, secondary and ctrl both mean Ctrl, unlike macOS.
[platform.linux]
refresh = ["secondary-shift-r"]
fullscreen = ["f11"]

